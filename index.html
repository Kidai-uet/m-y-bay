<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Máy Bay Bắn Lên</title>
    <style>
        /* Nền trắng tinh toàn màn hình */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung chứa */
        .game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-color: #ffffff;
        }

        /* Máy bay được đẩy lên vị trí cao phía trên */
        .player-plane {
            position: absolute;
            top: 150px; /* Vị trí cao lên sát phía trên theo ý bạn */
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            z-index: 5;
        }

        /* Đạn bắn từ máy bay vút lên cạnh trên màn hình */
        .laser-bullet {
            position: absolute;
            width: 4px;
            height: 20px;
            background-color: #ff3b30;
            box-shadow: 0 0 6px #ff3b30;
            top: 130px; /* Xuất phát ngay phía trên đầu máy bay */
            left: 50%;
            transform: translateX(-50%);
            animation: shootUp 0.5s linear infinite;
            z-index: 3;
        }

        @keyframes shootUp {
            0% { top: 130px; opacity: 1; }
            100% { top: -20px; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Đạn liên tục bắn lên trên -->
        <div class="laser-bullet"></div>
        
        <!-- Máy bay chiến đấu màu đen (Dạng SVG không lo bị lỗi ảnh) -->
        <svg class="player-plane" viewBox="0 0 24 24" fill="#000000">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L14 19v-5.5l8 2.5z"/>
        </svg>
    </div>

</body>
</html>
