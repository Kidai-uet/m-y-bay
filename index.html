<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* Cấu hình nền trắng toàn màn hình */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung chứa vùng chạy hoạt hình */
        .game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-color: #ffffff;
        }

        /* MÁY BAY TỰ VẼ BẰNG CSS - Đặt ở vị trí cao phía trên */
        .player-plane {
            position: absolute;
            top: 150px; /* Độ cao của máy bay */
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            z-index: 10;
        }

        /* Thân máy bay màu đen */
        .plane-body {
            position: absolute;
            top: 0; left: 24px;
            width: 12px; height: 60px;
            background-color: #000000;
            border-radius: 6px;
        }

        /* Cánh chính máy bay nằm ngang */
        .plane-wings {
            position: absolute;
            top: 20px; left: 0;
            width: 60px; height: 12px;
            background-color: #000000;
            border-radius: 4px;
        }

        /* Đuôi máy bay */
        .plane-tail {
            position: absolute;
            bottom: 0; left: 15px;
            width: 30px; height: 8px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Đạn laser xuất phát từ đầu máy bay bắn vút lên trên */
        .laser-bullet {
            position: absolute;
            width: 4px;
            height: 25px;
            background-color: #ff3b30;
            top: 120px; /* Vị trí xuất phát của đạn ngay trước mũi máy bay */
            left: 50%;
            transform: translateX(-50%);
            animation: shootUp 0.4s linear infinite;
            z-index: 5;
        }

        /* Đường đạn di chuyển vút lên cạnh trên cùng */
        @keyframes shootUp {
            0% {
                top: 120px;
                opacity: 1;
            }
            100% {
                top: -30px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Vệt đạn đỏ liên tục bắn lên -->
        <div class="laser-bullet"></div>
        
        <!-- Mô hình máy bay dựng bằng các khối hình học CSS -->
        <div class="player-plane">
            <div class="plane-wings"></div>
            <div class="plane-tail"></div>
            <div class="plane-body"></div>
        </div>
    </div>

</body>
</html>
