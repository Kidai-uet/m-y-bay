<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* Cấu hình nền trắng tinh toàn màn hình */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung chứa vùng hoạt hình */
        .game-area {
            width: 600px;
            height: 500px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Thiết kế máy bay tối giản màu đen để nổi bật trên nền trắng */
        .player-plane {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 46px;
            height: 40px;
            background: #000000;
            /* Cắt hình dạng mô phỏng chiến đấu cơ */
            clip-path: polygon(50% 0%, 100% 70%, 80% 70%, 80% 100%, 20% 100%, 20% 70%, 0% 70%);
        }

        /* Hiệu ứng tia đạn liên tục bắn vút lên trên */
        .bullet {
            position: absolute;
            width: 4px;
            height: 18px;
            background-color: #ff3b30; /* Đạn màu đỏ để dễ nhìn trên nền trắng */
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            animation: shootUp 0.8s linear infinite;
        }

        /* Đường đi của đạn từ vị trí máy bay lên cạnh trên màn hình */
        @keyframes shootUp {
            0% {
                bottom: 80px;
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 500px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="game-area">
        <!-- Tia đạn bắn lên -->
        <div class="bullet"></div>
        
        <!-- Máy bay điều khiển -->
        <div class="player-plane"></div>
    </div>

</body>
</html>
