<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* Cấu hình nền trắng toàn màn hình */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Khung chứa vùng hoạt hình */
        .game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Máy bay chiến đấu (Sử dụng ảnh thật) */
        .player-plane {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background-image: url('https://icons8.com');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
        }

        /* Tia đạn màu đỏ liên tục bắn vút lên */
        .laser-bullet {
            position: absolute;
            width: 4px;
            height: 20px;
            background-color: #ff3b30;
            box-shadow: 0 0 6px #ff3b30;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            animation: shootUp 1s linear infinite;
            z-index: 3;
        }

        @keyframes shootUp {
            0% { bottom: 90px; opacity: 1; }
            90% { opacity: 1; }
            100% { bottom: 600px; opacity: 0; }
        }

        /* Khu vực chứa các mục tiêu màu xanh phía trên */
        .target-zone {
            position: absolute;
            top: 60px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 2;
        }

        /* Các mục tiêu hình tròn màu xanh */
        .blue-target {
            width: 45px;
            height: 45px;
            border: 5px solid #007aff;
            border-radius: 50%;
            background-color: transparent;
            box-sizing: border-box;
            animation: floatAround 4s ease-in-out infinite alternate;
        }

        /* Hiệu ứng bay lắc lư nhẹ nhàng cho các vòng tròn xanh */
        @keyframes floatAround {
            0% { transform: translateX(-20px) scale(1); }
            100% { transform: translateX(20px) scale(1.1); }
        }

        /* Làm cho các mục tiêu di chuyển lệch nhịp nhau */
        .target-zone .blue-target:nth-child(2) { animation-delay: 0.8s; }
        .target-zone .blue-target:nth-child(3) { animation-delay: 1.5s; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Các mục tiêu vòng tròn màu xanh phía trên -->
        <div class="target-zone">
            <div class="blue-target"></div>
            <div class="blue-target"></div>
            <div class="blue-target"></div>
        </div>

        <!-- Đạn bắn lên -->
        <div class="laser-bullet"></div>
        
        <!-- Máy bay chiến đấu ở dưới -->
        <div class="player-plane"></div>
    </div>

</body>
</html>
